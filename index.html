<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Qwick Gig</title>
    <!-- Preload the display + body families only (<= 64 KB), self-hosted; never the Google CDN
         (requirements 28.4, 28.7). Space Mono is not preloaded; Caveat loads lazily (§I.4). -->
    <link rel="preload" href="/fonts/bricolage.subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dmsans.subset.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("fetch patch failed:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
