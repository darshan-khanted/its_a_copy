name: CI

# Build, type-check, and bundle-integrity verification for the Qwick Gig redesign.
# Every step is a one-shot (non-watch) command so the job always terminates.
# Traces to acceptance criteria: 28.2, 30.1, 30.3, 30.9.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · type-check · bundle guards
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Req 30.1 — a *fresh* install (lockfile-exact, no cached node_modules)
      # so the build and type-check are proven from a clean checkout.
      - name: Fresh install
        run: npm ci

      # Req 28.2, 30.2, 30.3, 30.9 — static guards run first so structural
      # regressions (umbrella Firebase, unresolved '@/' aliases, missing
      # server modules) fail fast before the slower build/type-check.
      - name: Verify bundle integrity
        run: npm run verify:bundle

      # Req 30.1, 30.3 — clean client type-check ('@/' alias must resolve
      # identically in TypeScript and the bundler).
      - name: Type-check (client)
        run: npm run type-check

      # Req 30.9 — clean server type-check against the scoped server tsconfig.
      - name: Type-check (server)
        run: npm run type-check:server

      # Req 30.1 — production client build (Vite, one-shot).
      - name: Build client
        run: npm run build:client

      # Req 30.9 — production server bundle (esbuild, one-shot).
      - name: Build server
        run: npm run build:server

      - name: Upload production build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: ignore
          retention-days: 7
